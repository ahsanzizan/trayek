name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trayek
          POSTGRES_PASSWORD: trayek
          POSTGRES_DB: trayek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trayek -d trayek_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://trayek:trayek@localhost:5432/trayek_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed invariant fixtures
        run: pnpm db:seed

      - name: Run repository checks
        run: pnpm check
