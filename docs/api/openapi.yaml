openapi: 3.1.0

# TRK-011: "Public API stub with an OpenAPI spec, not implemented, so
# integration conversations can start."
#
# NOTHING HERE IS IMPLEMENTED. This is a written proposal, published so a
# design partner's TMS vendor can tell us it is wrong before we build it.
# The live API is tRPC at /api/trpc and is not public.
#
# The shape deliberately mirrors the CSV import: same fields, same natural key,
# same idempotency rule. A partner who can produce the CSV can produce this
# payload, and neither path gets to invent an amount (INV-3).

info:
  title: Trayek Settle — Order Ingestion (proposed)
  version: 0.0.0-draft
  summary: Not implemented. Published to start integration conversations.
  description: |
    Lets a forwarder's existing TMS push orders into Trayek instead of
    exporting a spreadsheet.

    Two rules that will not change, whatever else does:

    - `nomorSuratJalan` is the natural key. Re-sending an order with a
      `nomorSuratJalan` we already hold updates it; it never creates a second
      row. This is what makes a retry after a timeout safe.
    - `nilaiTagihan` is stored exactly as sent, in whole rupiah. Trayek never
      computes, adjusts, or suggests it. There is no endpoint that returns a
      rate, and there will not be one.
  contact:
    name: Trayek Settle engineering

servers:
  - url: https://api.example.invalid/v1
    description: Placeholder. No deployment exists; hosting is an open decision.

security:
  - organizationApiKey: []

tags:
  - name: Orders
    description: Order ingestion and lookup.

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Create or update orders (proposed, not implemented)
      operationId: upsertOrders
      description: |
        Accepts up to 500 orders per call. Each row is validated independently:
        a malformed row is reported and skipped, and the rest of the batch is
        still applied. The whole batch is never rejected for one bad row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orders]
              properties:
                orders:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: Batch processed. Inspect per-row results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "401":
          description: Missing or invalid API key.
        "429":
          description: Rate limited.

    get:
      tags: [Orders]
      summary: List orders (proposed, not implemented)
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  nextCursor:
                    type: [string, "null"]

  /orders/{nomorSuratJalan}:
    get:
      tags: [Orders]
      summary: Fetch one order by its surat jalan number (proposed)
      operationId: getOrderBySuratJalan
      parameters:
        - name: nomorSuratJalan
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: |
            No such order in your organization. Returned rather than 403 for an
            order belonging to another tenant, so the response never reveals
            that an id exists elsewhere.

components:
  securitySchemes:
    organizationApiKey:
      type: apiKey
      in: header
      name: X-Trayek-Api-Key
      description: |
        Per-organization key. Scoped to one tenant; there is no cross-tenant
        read on this API.

  schemas:
    OrderStatus:
      type: string
      enum:
        - CREATED
        - IN_TRANSIT
        - DELIVERED
        - POD_RECEIVED
        - POD_VALIDATED
        - PACKET_READY
        - INVOICED
        - PAID
        - REJECTED

    OrderInput:
      type: object
      additionalProperties: false
      required: [nomorOrder, nomorSuratJalan, shipperNpwp, origin, destination]
      properties:
        nomorOrder:
          type: string
          maxLength: 100
        nomorSuratJalan:
          type: string
          maxLength: 100
          description: Natural key. Re-sending the same value updates in place.
        shipperNpwp:
          type: string
          description: |
            Shippers are referenced by NPWP rather than by our internal id, so
            a partner never has to store or look up a Trayek identifier.
        driverPhone:
          type: [string, "null"]
          description: |
            Any Indonesian spelling. Normalised to E.164 on arrival and matched
            against the existing driver, or a new one is created.
          examples: ["0812-3456-7890", "+62 812 3456 7890"]
        origin:
          type: string
          maxLength: 300
        destination:
          type: string
          maxLength: 300
        plannedDeliveryDate:
          type: [string, "null"]
          format: date
        actualDeliveryDate:
          type: [string, "null"]
          format: date
        jumlahKoli:
          type: [integer, "null"]
          minimum: 0
        weightGram:
          type: [integer, "null"]
          minimum: 0
        nilaiTagihan:
          type: [string, "null"]
          pattern: "^[0-9]+$"
          description: |
            Whole rupiah, as a decimal string so no JSON parser rounds a large
            amount through a float. Stored exactly as sent (INV-3).
          examples: ["4500000"]
        status:
          $ref: "#/components/schemas/OrderStatus"

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderInput"
        - type: object
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    BatchResult:
      type: object
      description: |
        Per-row outcomes. A caller retrying the whole batch after a partial
        failure is safe, because accepted rows key on nomorSuratJalan.
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Position in the submitted array.
              nomorSuratJalan:
                type: string
              outcome:
                type: string
                enum: [CREATED, UPDATED, REJECTED]
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string
                      description: Bahasa Indonesia, safe to show an operator.
